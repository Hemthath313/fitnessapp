<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Buddy – Legal & Privacy</title>
  <meta name="description" content="Gym Buddy Legal Documents, Privacy Policy, and Terms of Use.">
  <style>
    :root {
      --bg: #0b0f14;
      --card-bg: #141b22;
      --border: #263238;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --accent: #13d5bd;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-muted);
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #06201b;
    }
    .btn-primary:hover {
      background: #10bfa9;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .footer {
      margin-top: 32px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Gym Buddy</h1>
    <p>Official Legal Documents &amp; Policies</p>
    <div class="links">
      <a href="privacy-policy.html" class="btn btn-primary">Privacy Policy</a>
      <a href="terms-of-use.html" class="btn btn-secondary">Terms of Use</a>
    </div>
    <div class="footer">
      Developer: Hemthath &bull; Contact: <a href="mailto:buddyspps204@gmail.com">buddyspps204@gmail.com</a>
    </div>
  </div>
</body>
</html>
