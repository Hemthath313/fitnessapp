flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true  # Remove alpha channel for App Store compliance
  adaptive_icon_background: "#055cf2"  # Set to matching brand blue
  adaptive_icon_foreground: "assets/images/launcher_icon.png"
  image_path: "assets/images/launcher_icon.png"
